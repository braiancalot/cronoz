services:
  postgres:
    image: postgres:17-alpine
    container_name: cronoz-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_USER: cronoz
      POSTGRES_PASSWORD: cronoz
      POSTGRES_DB: cronoz
    volumes:
      - cronoz-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cronoz -d cronoz"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  cronoz-postgres-data:
